# Publish ghcr.io/orhaugh/clink-console: the clink-fe console served
# same-origin by a pinned clink coordinator (see Dockerfile). Tags carry
# both versions - <console>-clink<engine> - plus `latest`, so a pull states
# exactly which pairing it gets. Runs on release tags and on manual
# dispatch (which can override the engine pin to validate a new clink
# release before retagging).

name: console-image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      clink_version:
        description: 'clink runtime version to pin (e.g. 0.4.0)'
        default: '0.4.0'

permissions:
  contents: read
  packages: write

env:
  CLINK_VERSION: ${{ inputs.clink_version || '0.4.0' }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/clink-console

jobs:
  build-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: meta
        run: |
          fe_version="$(python3 -c "import json;print(json.load(open('package.json'))['version'])")"
          tags="${IMAGE}:${fe_version}-clink${CLINK_VERSION}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tags="${tags},${IMAGE}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "console ${fe_version} on clink ${CLINK_VERSION} -> ${tags}"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: CLINK_VERSION=${{ env.CLINK_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: Smoke test the pushed image
        # The console and the API must both answer from one origin.
        run: |
          set -euo pipefail
          tag="${IMAGE}:$(python3 -c "import json;print(json.load(open('package.json'))['version'])")-clink${CLINK_VERSION}"
          docker run -d --name console -p 8081:8081 "${tag}"
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8081/api/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8081/api/v1/health
          curl -fsS http://127.0.0.1:8081/ | grep -qi '<!doctype html>'
          curl -fsS http://127.0.0.1:8081/workers | grep -qi '<!doctype html>'
          docker rm -f console
          echo 'console + API answer from one origin'
